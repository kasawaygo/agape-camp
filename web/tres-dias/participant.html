<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7eee4"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"><title>Анкета участника TRES DIAS 2027</title><link rel="stylesheet" href="/tres-dias/assets/style.css"><script defer src="/tres-dias/assets/form.js"></script></head><body><main class="form-wrap"><div class="form-brand"><a href="/tres-dias/" aria-label="На главную TRES DIAS"><img class="form-brand-logo" src="/tres-dias/assets/agape-church-tres-dias.png" alt="Agape Church TRES DIAS"></a></div><a class="back" href="/tres-dias/">← Все анкеты</a><header class="form-head"><span class="eyebrow">TRES DIAS · 2027</span><h1>Анкета участника TRES DIAS 2027</h1><p>Поля со звёздочкой обязательны.</p></header><form class="form-card" data-form="participant"><label class="field"><span>ФИО <b>*</b></span><input name="name" autocomplete="name" maxlength="120" required placeholder="Имя и фамилия"></label><label class="field"><span>Дата рождения <b>*</b></span><input name="birthDate" type="date" required></label><label class="field"><span>Город проживания <b>*</b></span><input name="city" autocomplete="address-level2" maxlength="100" required></label><label class="field"><span>Номер телефона <b>*</b></span><input name="phone" type="tel" inputmode="tel" autocomplete="tel" required placeholder="+82 ..."></label><label class="field"><span>Какую церковь вы посещаете? <b>*</b></span><small>(Если посещаете)</small><input name="church" maxlength="160" required placeholder="Название церкви / не посещаю"></label><fieldset class="field"><legend>Участвовали ли вы ранее в TRES DIAS? <b>*</b></legend><label class="radio"><input type="radio" name="attendedBefore" value="true" required> Да</label><label class="radio"><input type="radio" name="attendedBefore" value="false"> Нет</label></fieldset><label class="field"><span>Размер одежды <b>*</b></span><select name="clothingSize" required><option value="">Выбрать</option><option>S</option><option>M</option><option>L</option><option>XL</option><option>2XL</option><option>3XL</option><option>4XL</option><option>5XL</option></select></label><label class="field"><span>Есть ли пожелания или особенности, которые нам важно учесть при вашем размещении?</span><small>(По желанию)</small><textarea name="accommodationNotes" rows="3" maxlength="1500"></textarea></label><div class="form-actions"><button type="submit">Отправить анкету</button><a href="/tres-dias/">Назад</a></div><p class="form-message" aria-live="polite"></p></form><footer class="privacy-note">Отправляя анкету, ты передаёшь данные организаторам TRES DIAS для подготовки мероприятия.</footer></main></body></html>
